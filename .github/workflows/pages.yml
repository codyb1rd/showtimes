name: Build and publish showtimes

on:
  schedule:
    - cron: "0 13 * * *"   # ~6 AM Pacific (5 AM in winter)
    - cron: "0 19 * * *"   # ~noon Pacific
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # lets the keepalive step re-enable this workflow

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The cache also holds gfill.json: the Google fills and this month's search count (gfill.py).
      # Restore and save are separate steps so the save runs even when the build fails; otherwise a
      # failed build would forget searches it already spent, and the next build would repeat them.
      - name: Restore ratings, poster and Google-fill cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/showtimes
          key: ratings-${{ github.run_id }}
          restore-keys: ratings-
      - name: Build site (every city in cities.txt)
        env:
          # Google fill keys, for builds of main only: a test run from another branch would spend
          # searches into a cache main never sees. Unset = cinemaclock only.
          SERPAPI_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SERPAPI_KEY || '' }}
          SEARCHAPI_KEY: ${{ github.ref == 'refs/heads/main' && secrets.SEARCHAPI_KEY || '' }}
        run: python showtimes.py --site _site
      - name: Save ratings, poster and Google-fill cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/showtimes
          key: ratings-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub switches off scheduled workflows in a public repo after 60 days with no
      # repository activity. Re-enabling it on every run keeps the schedule alive.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
