<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Showtimes</title>
<style>
:root {
  --bg: #f6f5f3; --card: #ffffff; --ink: #1b1a19; --muted: #6b6762; --line: #e4e1dc;
  --chip: #ffffff; --chip-line: #d6d2cb; --accent: #b4321f; --accent-ink: #ffffff;
  --accent-soft: #fbe9e5; --fresh: #c8321e; --rotten: #4f8a2b; --lb: #e07a1f;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04); --bar: rgba(246,245,243,.93);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --card: #1c1c1c; --ink: #eeebe6; --muted: #a29d96; --line: #2c2b29;
    --chip: #232323; --chip-line: #3a3936; --accent: #ef6a4f; --accent-ink: #1a0d09;
    --accent-soft: #3a1d16; --fresh: #f26b55; --rotten: #8cc063; --lb: #ff9a3c;
    --shadow: none; --bar: rgba(18,18,18,.93);
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --card: #1c1c1c; --ink: #eeebe6; --muted: #a29d96; --line: #2c2b29;
  --chip: #232323; --chip-line: #3a3936; --accent: #ef6a4f; --accent-ink: #1a0d09;
  --accent-soft: #3a1d16; --fresh: #f26b55; --rotten: #8cc063; --lb: #ff9a3c;
  --shadow: none; --bar: rgba(18,18,18,.93);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }

header.top { position: sticky; top: 0; z-index: 5; background: var(--bar); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.titlerow { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-top: 12px; }
h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; }
h1 span { color: var(--accent); }
.updated { color: var(--muted); font-size: 12.5px; }
.controls { display: flex; gap: 8px; align-items: center; margin: 9px 0 7px; }
.search { flex: 1; min-width: 0; height: 34px; border-radius: 17px; border: 1px solid var(--chip-line);
  background: var(--chip); color: var(--ink); padding: 0 14px; font: inherit; }
.search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.seg { display: inline-flex; border: 1px solid var(--chip-line); border-radius: 17px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--chip); font-size: 14px; padding: 0 13px; height: 32px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.scroller { display: flex; gap: 6px; overflow-x: auto; padding: 1px 0 8px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.pill { flex: none; border: 1px solid var(--chip-line); background: var(--chip); border-radius: 10px;
  padding: 5px 11px; font-size: 14px; cursor: pointer; text-align: center; line-height: 1.15; }
.pill small { display: block; font-size: 11px; color: var(--muted); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill[aria-pressed="true"] small { color: inherit; opacity: .8; }
.tchip { border-radius: 15px; padding: 4px 10px; font-size: 12.5px; }
.tchip[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; opacity: .7; }
.tchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }

.banner { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft);
  border: 1px solid var(--accent); font-size: 14px; }
main { padding: 12px 0 60px; }
.toolbar { display: flex; align-items: center; gap: 8px 14px; flex-wrap: wrap; margin-bottom: 12px; color: var(--muted); font-size: 13.5px; }
.toolbar .count { margin-right: auto; }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; }
select { font: inherit; font-size: 13.5px; color: var(--ink); background: var(--chip); border: 1px solid var(--chip-line);
  border-radius: 8px; padding: 4px 8px; }

/* Ratings */
.ratings { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; font-weight: 600; }
.ratings a, .ratings span { text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.ratings a:hover { text-decoration: underline; }
.rt.fresh { color: var(--fresh); } .rt.rotten { color: var(--rotten); } .lb { color: var(--lb); }
.ratings .none { color: var(--muted); font-weight: 400; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; display: inline-block; }
.lbdots { display: inline-flex; gap: 2px; }
.lbdots i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.lbdots i:nth-child(1) { background: #ff8000; } .lbdots i:nth-child(2) { background: #00e054; } .lbdots i:nth-child(3) { background: #40bcf4; }

/* Poster grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
.tile { text-align: left; border: 0; background: none; padding: 0; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-self: start; }
.tile .art { aspect-ratio: 2 / 3; border-radius: 10px; background: var(--line) center/cover no-repeat;
  box-shadow: var(--shadow); border: 1px solid var(--line); transition: transform .12s ease; }
.tile:hover .art { transform: translateY(-2px); }
.tile:focus-visible .art { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile h3 { font-size: 14.5px; margin: 7px 0 2px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.tile .meta { font-size: 12px; }
.tile .ratings { margin-top: 3px; }
.tile .next { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile .next b { color: var(--accent); font-weight: 600; }
@media (max-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px 10px; } .tile h3 { font-size: 13px; } }

.meta { color: var(--muted); font-size: 13px; }
.rating { display: inline-block; border: 1px solid var(--chip-line); border-radius: 4px; padding: 0 4px;
  font-size: 11px; color: var(--ink); margin-right: 3px; vertical-align: 1px; line-height: 1.4; }

/* Detail + cards */
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--accent);
  font-size: 14px; padding: 4px 0; margin-bottom: 8px; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  margin-bottom: 12px; overflow: hidden; }
.hero { display: flex; gap: 16px; padding: 16px; }
.hero .art { flex: none; width: 104px; aspect-ratio: 2 / 3; border-radius: 9px; background: var(--line) center/cover no-repeat; }
.hero h2 { font-size: 21px; margin: 0 0 4px; line-height: 1.2; }
.hero .ratings { font-size: 14px; margin: 8px 0 4px; gap: 14px; }
.cast { font-size: 13px; color: var(--muted); margin-top: 4px; }
.more { font-size: 13px; color: var(--muted); margin-top: 6px; display: inline-block; }

.venue { border-top: 1px solid var(--line); padding: 10px 14px 12px; }
.vname { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.vname a { font-weight: 600; text-decoration: none; font-size: 15px; }
.vname a:hover { text-decoration: underline; }
.dist { color: var(--muted); font-size: 12.5px; white-space: nowrap; }

/* Compact time rows */
.frow { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; align-items: baseline; padding: 3px 0; }
.flabel { font-size: 12px; color: var(--muted); line-height: 1.25; }
.flabel em { font-style: normal; opacity: .75; }
.times { display: flex; flex-wrap: wrap; gap: 5px; }
.time { display: inline-block; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--chip-line);
  background: var(--chip); font-size: 13px; font-weight: 600; text-decoration: none; color: var(--accent);
  font-variant-numeric: tabular-nums; }
a.time:hover { border-color: var(--accent); background: var(--accent-soft); }
.time.notix { color: var(--ink); font-weight: 500; cursor: default; }
@media (max-width: 560px) { .frow { grid-template-columns: 1fr; gap: 3px; padding: 4px 0; } }

.thead { padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.thead h2 { font-size: 17px; margin: 0 0 2px; }
.thead h2 a { text-decoration: none; }
.btn { flex: none; font-size: 13px; padding: 5px 10px; border: 1px solid var(--chip-line); border-radius: 8px; text-decoration: none; background: var(--chip); }
.btn:hover { border-color: var(--accent); }
.tmovie { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 12px; }
.tmovie .art { flex: none; width: 44px; aspect-ratio: 2 / 3; border-radius: 5px; background: var(--line) center/cover no-repeat; cursor: pointer; }
.tmovie .body { min-width: 0; flex: 1; }
.tmovie .ttl { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; margin-bottom: 3px; }
.tmovie h3 { font-size: 15px; margin: 0; }
.tmovie h3 a { text-decoration: none; cursor: pointer; }
.tmovie h3 a:hover { text-decoration: underline; }
.empty { text-align: center; color: var(--muted); padding: 40px 10px; }
.none { color: var(--muted); font-size: 14px; padding: 0 14px 14px; }
footer { color: var(--muted); font-size: 12px; text-align: center; padding: 0 16px 30px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlerow"><h1>Showtimes <span id="city"></span></h1><div class="updated" id="updated"></div></div>
    <div class="controls">
      <input class="search" id="q" type="search" placeholder="Search movies" autocomplete="off">
      <div class="seg" role="group" aria-label="View">
        <button id="vMovies" aria-pressed="true">Movies</button><button id="vTheaters" aria-pressed="false">Theaters</button>
      </div>
    </div>
    <div class="scroller" id="dates" role="group" aria-label="Date"></div>
    <div class="scroller" id="theaters" role="group" aria-label="Theaters"></div>
  </div>
</header>
<div class="wrap">
  <div id="banner"></div>
  <main id="main"></main>
</div>
<footer>Times and ticket links from cinemaclock.com · scores from Rotten Tomatoes and Letterboxd. Tap a time to buy tickets.</footer>

<script>
const DATA = /*__DATA__*/null;

const store = {
  get(k, d) { try { const v = localStorage.getItem('st:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('st:' + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const today = isoLocal(new Date());
const tomorrow = isoLocal(new Date(Date.now() + 864e5));
const theaterById = Object.fromEntries(DATA.theaters.map(t => [t.id, t]));
const allDates = [...new Set(DATA.groups.flatMap(g => Object.keys(g.days)))].sort();
const futureDates = allDates.filter(d => d >= today);
const dates = futureDates.length ? futureDates : allDates;

const SORTS = { popular: 'Most showings', soonest: 'Starting soonest', rt: 'Rotten Tomatoes', lb: 'Letterboxd', az: 'A–Z' };
const AFTER = [[0, 'Any time'], [12, '12 PM'], [15, '3 PM'], [17, '5 PM'], [19, '7 PM'], [21, '9 PM']];
const state = {
  view: store.get('view', 'movies'),
  sort: store.get('sort', 'popular'),
  after: store.get('after', 0),
  date: dates[0],
  hidden: new Set(store.get('hidden:' + DATA.slug, [])),
  q: '',
  movie: null
};

/* ---------- formatting ---------- */
function fmtTime(t) {
  let h = Math.floor(t / 100) % 24; const m = t % 100, ap = h < 12 ? 'am' : 'pm';
  return (h % 12 || 12) + ':' + pad(m) + ap;
}
function minutes(t) { return Math.floor(t / 100) * 60 + t % 100; }
function started(date, t) {
  if (date !== today) return date < today;
  const now = new Date();
  return t < 2400 && minutes(t) < now.getHours() * 60 + now.getMinutes();
}
/* A showing is shown when it hasn't started and passes the "starts after" filter.
   Times past midnight (2400+) count as late, so they pass any filter. */
function keep(date, t) { return !started(date, t) && (t >= 2400 || t >= state.after * 100); }
function upcoming(g) { return (g.days[state.date] || []).filter(([t]) => keep(state.date, t)).sort((a, b) => a[0] - b[0]); }

const ACCESS = { 'closed captions': 'CC', 'audio description': 'AD', 'on-screen captions': 'Captions' };
function fmtLabel(g) {
  let f = (g.fmt || '').replace(/Standard auditorium\s*/i, '').replace(/with Eng\. subt\./i, 'Subtitled')
    .replace(/Motion Seats/i, '').replace(/\s*•\s*/g, ' · ').replace(/^ · | · $/g, '').trim();
  const extras = g.notes.join(', ').replace(/^Optional:\s*/i, '').split(/,\s*/).filter(Boolean)
    .map(x => ACCESS[x.toLowerCase()] || x);
  return esc(f || 'Standard') + (extras.length ? ` <em>· ${esc(extras.join(' · '))}</em>` : '');
}
function dateLabel(d) {
  const [y, m, day] = d.split('-').map(Number);
  const top = d === today ? 'Today' : d === tomorrow ? 'Tomorrow' : DOW[new Date(y, m - 1, day).getDay()];
  return { top, sub: MON[m - 1] + ' ' + day };
}
function art(m, cls) {
  return `<div class="art ${cls || ''}"${m.poster ? ` style="background-image:url('${m.poster}')"` : ''} role="img" aria-label="${esc(m.title)} poster"></div>`;
}
function metaLine(m, full) {
  const bits = [m.runtime, full ? m.genre : null, m.year].filter(Boolean).map(esc).join(' · ');
  return (m.rating ? `<span class="rating">${esc(m.rating)}</span>` : '') + bits;
}
function ratings(m, link) {
  const out = [];
  const wrap = (cls, url, inner) => link && url
    ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>` : `<span class="${cls}">${inner}</span>`;
  if (m.rt) {
    const s = m.rt.score;
    out.push(s == null ? wrap('rt none', m.rt.url, 'RT —')
      : wrap('rt ' + (s >= 60 ? 'fresh' : 'rotten'), m.rt.url, `<span class="dot"></span>${s}%`));
  }
  if (m.lb) {
    out.push(m.lb.score == null ? wrap('lb none', m.lb.url, 'LB —')
      : wrap('lb', m.lb.url, `<span class="lbdots"><i></i><i></i><i></i></span>${m.lb.score.toFixed(1)}`));
  }
  return out.length ? `<div class="ratings">${out.join('')}</div>` : '';
}
function chips(times) {
  return times.map(([t, tix]) => tix
    ? `<a class="time" href="${esc(DATA.tixBase + tix)}" target="_blank" rel="noopener" title="Buy tickets">${fmtTime(t)}</a>`
    : `<span class="time notix" title="No online ticketing — buy at the theater">${fmtTime(t)}</span>`).join('');
}
function formatRows(groups) {
  return groups.map(g => [g, upcoming(g)]).filter(([, ts]) => ts.length)
    .map(([g, ts]) => `<div class="frow"><div class="flabel">${fmtLabel(g)}</div><div class="times">${chips(ts)}</div></div>`).join('');
}

/* ---------- data selection ---------- */
function visibleGroups(ignoreSearch) {
  const q = ignoreSearch ? '' : state.q.trim().toLowerCase();
  return DATA.groups.filter(g => g.days[state.date] && !state.hidden.has(g.tid) && upcoming(g).length
    && (!q || DATA.movies[g.mid].title.toLowerCase().includes(q)));
}
const groupBy = (arr, k) => arr.reduce((o, x) => ((o[x[k]] ??= []).push(x), o), {});
const byDist = (a, b) => theaterById[a].dist - theaterById[b].dist;

function sortMovies(byMovie) {
  const stats = {};
  for (const [mid, gs] of Object.entries(byMovie)) {
    const ts = gs.flatMap(upcoming);
    stats[mid] = { n: ts.length, first: Math.min(...ts.map(([t]) => t)) };
  }
  const M = DATA.movies, title = (a, b) => M[a].title.localeCompare(M[b].title);
  const score = (m, k) => m[k] && m[k].score != null ? m[k].score : -1;
  const cmp = {
    popular: (a, b) => stats[b].n - stats[a].n || title(a, b),
    soonest: (a, b) => stats[a].first - stats[b].first || title(a, b),
    rt: (a, b) => score(M[b], 'rt') - score(M[a], 'rt') || title(a, b),
    lb: (a, b) => score(M[b], 'lb') - score(M[a], 'lb') || title(a, b),
    az: title
  }[state.sort];
  return { mids: Object.keys(byMovie).sort(cmp), stats };
}

/* ---------- views ---------- */
function toolbar(count, noun) {
  const opt = (v, l, cur) => `<option value="${v}"${String(v) === String(cur) ? ' selected' : ''}>${l}</option>`;
  return `<div class="toolbar"><span class="count">${count} ${noun}</span>
    ${state.view === 'movies' ? `<label>Sort <select id="sort">${Object.entries(SORTS).map(([v, l]) => opt(v, l, state.sort)).join('')}</select></label>` : ''}
    <label>Starts after <select id="after">${AFTER.map(([v, l]) => opt(v, l, state.after)).join('')}</select></label></div>`;
}

function renderGrid() {
  const byMovie = groupBy(visibleGroups(), 'mid');
  const { mids, stats } = sortMovies(byMovie);
  const tiles = mids.map(mid => {
    const m = DATA.movies[mid], s = stats[mid];
    const nT = new Set(byMovie[mid].map(g => g.tid)).size;
    const next = state.date === today ? `Next <b>${fmtTime(s.first)}</b>` : `${s.n} showing${s.n > 1 ? 's' : ''}`;
    return `<button class="tile" data-mid="${mid}">${art(m)}<h3>${esc(m.title)}</h3>
      <div class="meta">${metaLine(m)}</div>${ratings(m, false)}
      <div class="next">${next} · ${nT} theater${nT > 1 ? 's' : ''}</div></button>`;
  }).join('');
  return toolbar(mids.length, mids.length === 1 ? 'movie' : 'movies') +
    (tiles ? `<div class="grid">${tiles}</div>` : emptyMsg());
}

function renderDetail(mid) {
  const m = DATA.movies[mid];
  const gs = DATA.groups.filter(g => g.mid === mid && g.days[state.date] && !state.hidden.has(g.tid) && upcoming(g).length);
  const byT = groupBy(gs, 'tid');
  const venues = Object.keys(byT).sort(byDist).map(tid => {
    const t = theaterById[tid];
    return `<div class="venue"><div class="vname"><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a><span class="dist">${t.dist} mi</span></div>${formatRows(byT[tid])}</div>`;
  }).join('');
  return `<button class="back" id="back">‹ All movies</button>
    <article class="card"><div class="hero">${art(m)}<div>
      <h2>${esc(m.title)}</h2><div class="meta">${metaLine(m, true)}</div>
      ${ratings(m, true)}
      ${m.cast ? `<div class="cast">${esc(m.cast)}</div>` : ''}
      <a class="more" href="${esc(m.url)}" target="_blank" rel="noopener">Details &amp; trailer ›</a>
    </div></div>${venues || `<div class="none">No upcoming showings ${state.date === today ? 'left today' : 'this day'}${state.after ? ' after ' + AFTER.find(a => a[0] === state.after)[1] : ''}.</div>`}</article>`;
}

function renderTheaters() {
  const byT = groupBy(visibleGroups(), 'tid');
  const tids = DATA.theaters.map(t => t.id).filter(id => !state.hidden.has(id));
  const cards = tids.map(tid => {
    const t = theaterById[tid], byM = groupBy(byT[tid] || [], 'mid');
    const mids = Object.keys(byM).sort((a, b) => DATA.movies[a].title.localeCompare(DATA.movies[b].title));
    const body = mids.length ? mids.map(mid => {
      const m = DATA.movies[mid];
      return `<div class="tmovie"><div data-mid="${mid}">${art(m)}</div><div class="body">
        <div class="ttl"><h3><a data-mid="${mid}">${esc(m.title)}</a></h3><span class="meta">${metaLine(m)}</span>${ratings(m, false)}</div>
        ${formatRows(byM[mid])}</div></div>`;
    }).join('') : `<div class="none">${state.q ? 'No matching movies here.' : 'No upcoming showings.'}</div>`;
    return `<article class="card"><div class="thead"><div><h2><a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a></h2>
      <div class="meta">${esc(t.address)} · ${t.dist} mi</div></div>
      <a class="btn" href="${esc(t.maps)}" target="_blank" rel="noopener">Directions</a></div>${body}</article>`;
  }).join('');
  return toolbar(tids.length, tids.length === 1 ? 'theater' : 'theaters') + cards;
}

function emptyMsg() {
  return `<div class="empty">${state.q ? 'No movies match “' + esc(state.q) + '”.' : 'No upcoming showings for this day with these filters.'}</div>`;
}

function renderDates() {
  $('dates').innerHTML = dates.map(d => {
    const l = dateLabel(d);
    return `<button class="pill" data-date="${d}" aria-pressed="${d === state.date}">${l.top}<small>${l.sub}</small></button>`;
  }).join('');
}
function renderTheaterChips() {
  $('theaters').innerHTML = DATA.theaters.map(t =>
    `<button class="pill tchip" data-tid="${t.id}" aria-pressed="${!state.hidden.has(t.id)}" title="${esc(t.address)}">${esc(t.name)} · ${t.dist} mi</button>`).join('');
}
function render() {
  const inDetail = state.movie && DATA.movies[state.movie];
  $('vMovies').setAttribute('aria-pressed', state.view === 'movies' || !!inDetail);
  $('vTheaters').setAttribute('aria-pressed', state.view === 'theaters' && !inDetail);
  $('main').innerHTML = inDetail ? renderDetail(state.movie) : state.view === 'movies' ? renderGrid() : renderTheaters();
}

/* ---------- routing: #m/<id> opens a movie, so the browser Back button works ---------- */
function readHash() { const m = location.hash.match(/^#m\/(\d+)/); state.movie = m ? m[1] : null; }
let openedHere = false;
function openMovie(mid) { openedHere = true; location.hash = 'm/' + mid; }
function closeMovie() { if (openedHere) { openedHere = false; history.back(); } else location.hash = ''; }
window.addEventListener('hashchange', () => { readHash(); render(); window.scrollTo({ top: 0 }); });

/* ---------- header + events ---------- */
$('city').textContent = DATA.city;
const gen = new Date(DATA.generated);
$('updated').textContent = `Updated ${DOW[gen.getDay()]} ${MON[gen.getMonth()]} ${gen.getDate()}, ${fmtTime(gen.getHours() * 100 + gen.getMinutes())} · ${DATA.theaters.length} theaters within ${DATA.radius} mi`;
const ageH = (Date.now() - gen.getTime()) / 36e5;
const notes = [];
if (!futureDates.length) notes.push('These times are all in the past. Rebuild the page for current showtimes.');
else if (ageH > 36) notes.push(`These times were collected ${Math.round(ageH / 24)} days ago and may have changed. Rebuild for fresh times.`);
if (DATA.failed.length) notes.push('Could not read: ' + DATA.failed.map(esc).join('; '));
$('banner').innerHTML = notes.map(n => `<div class="banner">${n}</div>`).join('');

$('dates').addEventListener('click', e => {
  const b = e.target.closest('[data-date]'); if (!b) return;
  state.date = b.dataset.date; renderDates(); render();
});
$('theaters').addEventListener('click', e => {
  const b = e.target.closest('[data-tid]'); if (!b) return;
  const id = b.dataset.tid;
  state.hidden.has(id) ? state.hidden.delete(id) : state.hidden.add(id);
  if (state.hidden.size === DATA.theaters.length) state.hidden.clear();
  store.set('hidden:' + DATA.slug, [...state.hidden]);
  renderTheaterChips(); render();
});
function setView(v) { state.view = v; store.set('view', v); if (state.movie) { location.hash = ''; } else render(); }
$('vMovies').onclick = () => setView('movies');
$('vTheaters').onclick = () => setView('theaters');
$('q').addEventListener('input', e => { state.q = e.target.value; if (state.movie) location.hash = ''; else render(); });
$('main').addEventListener('click', e => {
  if (e.target.closest('#back')) return closeMovie();
  const t = e.target.closest('[data-mid]'); if (t) openMovie(t.dataset.mid);
});
$('main').addEventListener('change', e => {
  if (e.target.id === 'sort') { state.sort = e.target.value; store.set('sort', state.sort); }
  if (e.target.id === 'after') { state.after = Number(e.target.value); store.set('after', state.after); }
  render();
});

readHash(); renderDates(); renderTheaterChips(); render();
// Drop showings as they start, while the page is open.
setInterval(() => { if (!document.querySelector('select:focus')) render(); }, 60000);
</script>
</body>
</html>
