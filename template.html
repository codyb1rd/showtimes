<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Showtimes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root {
  --bg: #f6f5f3; --card: #ffffff; --ink: #1b1a19; --muted: #6b6762; --line: #e4e1dc;
  --chip: #ffffff; --chip-line: #d6d2cb; --accent: #b4321f; --accent-ink: #ffffff;
  --accent-soft: #fbe9e5; --fresh: #c8321e; --rotten: #4f8a2b; --lb: #e07a1f; --pin: #6b6762;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04); --bar: rgba(246,245,243,.93);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --card: #1c1c1c; --ink: #eeebe6; --muted: #a29d96; --line: #2c2b29;
    --chip: #232323; --chip-line: #3a3936; --accent: #ef6a4f; --accent-ink: #1a0d09;
    --accent-soft: #3a1d16; --fresh: #f26b55; --rotten: #8cc063; --lb: #ff9a3c; --pin: #a29d96;
    --shadow: none; --bar: rgba(18,18,18,.93);
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --card: #1c1c1c; --ink: #eeebe6; --muted: #a29d96; --line: #2c2b29;
  --chip: #232323; --chip-line: #3a3936; --accent: #ef6a4f; --accent-ink: #1a0d09;
  --accent-soft: #3a1d16; --fresh: #f26b55; --rotten: #8cc063; --lb: #ff9a3c; --pin: #a29d96;
  --shadow: none; --bar: rgba(18,18,18,.93);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
a { color: inherit; }
button { font: inherit; color: inherit; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px; }

header.top { position: sticky; top: 0; z-index: 1000; background: var(--bar); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
/* Desktop: title, movie search and the Movies/Theaters switch share one row. Phones: the title
   gets its own row (so the city name isn't cut short) and search + switch sit under it. */
.titlerow { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: 9px 10px; padding: 12px 0 9px; }
h1 { display: flex; align-items: center; gap: 6px; font-size: 21px; margin: 0; letter-spacing: -.01em; min-width: 0; white-space: nowrap; }
/* The city name in the title is the city chooser. */
.cityb { display: inline-flex; align-items: center; gap: 4px; min-width: 0; font: inherit; color: var(--accent);
  background: none; border: 0; border-radius: 8px; padding: 1px 4px; margin: 0 -4px; cursor: pointer; }
.cityb #city { overflow: hidden; text-overflow: ellipsis; }
.cityb svg { flex: none; width: 15px; height: 15px; transition: transform .12s ease; }
.cityb:hover, .cityb[aria-expanded="true"] { background: var(--accent-soft); }
.cityb[aria-expanded="true"] svg { transform: rotate(180deg); }
.cityb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.cityb:disabled { cursor: default; background: none; }
.cityb:disabled svg { display: none; }
.cpop { position: absolute; top: calc(100% - 4px); z-index: 1100; width: 300px; padding: 8px; }
.cpop, .menu { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 6px 24px rgba(0,0,0,.18); }
.cpop .field { width: 100%; }
.clist { max-height: min(60vh, 400px); overflow-y: auto; overscroll-behavior: contain; margin-top: 6px; }
.copt { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: none;
  text-align: left; padding: 7px 10px; border-radius: 7px; font-size: 14.5px; cursor: pointer; }
.copt.act, .copt:hover, .copt:focus-visible { background: var(--chip); }
.copt:focus { outline: none; }
.copt:focus-visible { box-shadow: inset 0 0 0 1.5px var(--chip-line); }
.copt[aria-selected="true"] { color: var(--accent); font-weight: 600; }
.copt[aria-selected="true"]::after { content: "✓"; }
.cnone { color: var(--muted); font-size: 13.5px; padding: 8px 10px; }
.seg { display: inline-flex; border: 1px solid var(--chip-line); border-radius: 17px; overflow: hidden; flex: none; }
.seg button { border: 0; background: var(--chip); font-size: 14px; padding: 0 13px; height: 32px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.field { flex: 1; min-width: 0; height: 34px; border-radius: 17px; border: 1px solid var(--chip-line);
  background: var(--chip); color: var(--ink); padding: 0 14px; font: inherit; }
.field:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#q { flex: 0 1 340px; margin-left: auto; }
@media (max-width: 620px) {
  h1 { flex: 1 1 100%; }
  #q { flex: 1 1 0; margin-left: 0; }
  .cpop { left: 0 !important; right: 0; width: auto; }
}
/* 16px text in the boxes stops iPhones zooming the page when one is tapped. */
@media (max-width: 520px) { .field { font-size: 16px; } }
.scroller { display: flex; gap: 6px; overflow-x: auto; padding: 1px 0 8px; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.pill { flex: none; border: 1px solid var(--chip-line); background: var(--chip); border-radius: 10px;
  padding: 5px 11px; font-size: 14px; cursor: pointer; text-align: center; line-height: 1.15; }
.pill small { display: block; font-size: 11px; color: var(--muted); }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.pill[aria-pressed="true"] small { color: inherit; opacity: .8; }

.sub { color: var(--muted); font-size: 12.5px; margin: 12px 0 8px; }
.note { margin: 12px 0 0; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft);
  border: 1px solid var(--accent); font-size: 14px; }
.note.plain { background: var(--card); border-color: var(--line); }
/* Where panel: a square map and the theater list beside it, which is also the theater picker. */
.area { display: flex; gap: 10px; height: 172px; margin: 12px 0 10px; }
#mapwrap { flex: none; }
#map { width: 172px; height: 172px; border-radius: 12px; border: 1px solid var(--line); background: var(--line); z-index: 0; }
.tlist { position: relative; flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); align-content: start; gap: 1px 14px;
  padding: 5px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
.trow { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 9px;
  padding: 5px 8px; border: 0; border-radius: 7px; background: none; text-align: left; cursor: pointer;
  font-size: 13.5px; line-height: 1.25; }
.trow:hover, .trow.hot { background: var(--chip); }
.trow[aria-pressed="true"] { background: var(--accent-soft); }
.trow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.trow .pin { width: 8px; height: 8px; border-radius: 50%; background: var(--pin); }
.trow[aria-pressed="true"] .pin { background: var(--accent); }
.trow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .mi, .trow .ct { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.trow .ct { min-width: 4.6em; }
.trow .ct b { color: var(--ink); font-weight: 600; }
.trow .ct.gap { color: var(--accent); text-decoration: none; }
.trow .ct.gap:hover { text-decoration: underline; }
.trow.zero { opacity: .45; }
.trow.all { grid-column: 1 / -1; font-weight: 600; grid-template-columns: 8px minmax(0, 1fr) auto auto; }
.trow.all .pin { background: none; box-shadow: inset 0 0 0 2px var(--pin); }
.trow.all[aria-pressed="true"] .pin { box-shadow: inset 0 0 0 2px var(--accent); }
.bar { margin: 0 0 18px; }
.bar .toolbar { margin: 0; }
.toolbar .upd { margin-left: auto; font-size: 12.5px; white-space: nowrap; }
.leaflet-control-attribution { font-size: 8px !important; line-height: 1.3; padding: 0 3px !important; }
/* OpenStreetMap tiles are light only; darken them to sit in the dark theme. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }
}
:root[data-theme="dark"] .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6); }
.leaflet-tooltip { font: 12.5px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
/* Shown on the map once it has been zoomed or moved so that some theaters are out of view. */
.mapreset { border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink); border-radius: 8px;
  font-size: 12px; padding: 3px 8px; cursor: pointer; box-shadow: var(--shadow); }
.tnone { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; padding: 6px 8px; }
/* Phones: the map goes full width above the list, so theater names get the whole width, and a
   long name wraps to a second line rather than cutting off where similar names look the same. */
@media (max-width: 520px) {
  .area { flex-direction: column; height: auto; gap: 8px; }
  #map { width: 100%; height: 170px; }
  .tlist { grid-template-columns: 1fr; max-height: 190px; }
  .trow { gap: 7px; padding: 5px 6px; font-size: 13px; }
  .trow .nm { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
}
/* Phones fold the map and theater list into one line (#wherebar) so the movies start near the top.
   Folded, the panel is moved off screen rather than hidden: the map keeps its real size, so the
   "in view" filter works exactly as when it's open (a hidden map would have no theaters in view). */
.wherebar { display: none; }
@media (max-width: 520px) {
  .wherebar { display: flex; align-items: center; gap: 8px; width: 100%; margin: 8px 0 6px; padding: 0 11px;
    height: 36px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    font-size: 13.5px; text-align: left; cursor: pointer; }
  .wherebar .wpin { flex: none; width: 15px; height: 15px; color: var(--accent); }
  .wherebar .wsum { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wherebar .wsum b { font-weight: 600; }
  .wherebar .wupd { flex: none; color: var(--muted); font-size: 11.5px; }
  .wherebar > svg:last-child { flex: none; width: 15px; height: 15px; color: var(--muted); transition: transform .12s ease; }
  .wherebar[aria-expanded="true"] > svg:last-child { transform: rotate(180deg); }
  .area.folded { position: absolute; left: -10000px; top: 0; width: calc(100vw - 24px); visibility: hidden; }
  .area { margin-top: 0; }
  /* One swipeable line of Sort by / Starts after / Group; "Updated" moves into the theaters line. */
  .bar { margin: 0 -12px 8px; }
  .bar .toolbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 0 12px; }
  /* Tighter phone spacing: 12px side margins and smaller gaps between the rows above the movies. */
  .wrap { padding: 0 12px; }
  .titlerow { padding: 10px 0 8px; gap: 8px 10px; }
  .scroller { padding-bottom: 7px; }
  .bar .toolbar::-webkit-scrollbar { display: none; }
  .toolbar .chipb { flex: none; }
  .toolbar .upd { display: none; }
  /* Scrolling down tucks the whole top bar (dates too) off the top edge; scrolling up brings it back. */
  header.top { transition: transform .2s ease; }
  header.top.tuck { transform: translateY(calc(-1 * var(--tuck, 95px))); }
}
.msec + .msec { margin-top: 30px; }
.sech { font-size: 17px; margin: 0 0 12px; letter-spacing: -.01em; }
.sech span { color: var(--muted); font-weight: 400; font-size: 14px; margin-left: 4px; }
.rt svg { width: 14px; height: 14px; flex: none; }

main { padding: 0 0 60px; }
.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; color: var(--muted); font-size: 13.5px; }
/* Sort by / Starts after / Group by release type: pills as wide as their text, not as wide as the longest
   choice (which is what a plain <select> does). Sort and Starts after open a menu (#menu). */
.chipb { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 9px 0 11px; border-radius: 14px;
  border: 1px solid var(--chip-line); background: var(--chip); color: var(--ink); font-size: 12px; cursor: pointer; white-space: nowrap; }
.chipb .cl { color: var(--muted); }
.chipb b { font-weight: 600; }
.chipb svg { width: 12px; height: 12px; color: var(--muted); transition: transform .12s ease; }
.chipb[aria-expanded="true"] svg { transform: rotate(180deg); }
.chipb:hover, .chipb[aria-expanded="true"] { border-color: var(--accent); }
.chipb:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.chipb.tog { padding: 0 11px 0 8px; }
.chipb.tog::before { content: ""; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--chip-line);
  display: inline-flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; line-height: 1; }
.chipb.tog[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.chipb.tog[aria-pressed="true"]::before { content: "✓"; background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.menu { position: absolute; z-index: 1100; min-width: 190px; padding: 6px; }

.ratings { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12.5px; font-weight: 600; }
.ratings a, .ratings span { text-decoration: none; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.ratings a:hover { text-decoration: underline; }
.rt.fresh { color: var(--fresh); } .rt.rotten { color: var(--rotten); } .lb { color: var(--lb); }
.ratings .none { color: var(--muted); font-weight: 400; }
.lbdots { display: inline-flex; gap: 2px; }
.lbdots i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.lbdots i:nth-child(1) { background: #ff8000; } .lbdots i:nth-child(2) { background: #00e054; } .lbdots i:nth-child(3) { background: #40bcf4; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px 14px; }
.tile { text-align: left; border: 0; background: none; padding: 0; cursor: pointer; min-width: 0;
  display: flex; flex-direction: column; align-self: start; }
.tile .art { aspect-ratio: 2 / 3; border-radius: 10px; background: var(--line) center/cover no-repeat;
  box-shadow: var(--shadow); border: 1px solid var(--line); transition: transform .12s ease; }
.tile:hover .art { transform: translateY(-2px); }
.tile:focus-visible .art { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile h3 { font-size: 14.5px; margin: 7px 0 2px; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.tile .meta { font-size: 12px; }
.tile .ratings { margin-top: 3px; }
.tile .next { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile .next b { color: var(--accent); font-weight: 600; }
/* Phones: three across, posters a little shorter (a light crop at the sides) and the text under them tighter. */
@media (max-width: 520px) {
  .grid { grid-template-columns: repeat(3, 1fr); gap: 12px 8px; }
  .sech { font-size: 16px; margin-bottom: 8px; }
  .msec + .msec { margin-top: 22px; }
  .tile .art { aspect-ratio: 5 / 7; border-radius: 8px; }
  .tile h3 { font-size: 13px; line-height: 1.15; margin: 5px 0 1px; }
  .tile .meta { font-size: 11px; }
  .tile .meta .rating { font-size: 10px; padding: 0 3px; }
  .tile .ratings { margin-top: 1px; font-size: 11.5px; gap: 8px; }
  .tile .next { font-size: 11.5px; margin-top: 1px; }
}

.meta { color: var(--muted); font-size: 13px; }
.rating { display: inline-block; border: 1px solid var(--chip-line); border-radius: 4px; padding: 0 4px;
  font-size: 11px; color: var(--ink); margin-right: 3px; vertical-align: 1px; line-height: 1.4; }

.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--accent);
  font-size: 14px; padding: 4px 0; margin: 4px 0 8px; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  margin-bottom: 12px; overflow: hidden; }
.hero { display: flex; gap: 16px; padding: 16px; }
.hero .art { flex: none; width: 104px; aspect-ratio: 2 / 3; border-radius: 9px; background: var(--line) center/cover no-repeat; }
.hero h2 { font-size: 21px; margin: 0 0 4px; line-height: 1.2; }
.hero .ratings { font-size: 14px; margin: 8px 0 4px; gap: 14px; }
.cast { font-size: 13px; color: var(--muted); margin-top: 4px; }
.more { font-size: 13px; color: var(--muted); margin-top: 6px; display: inline-block; }

.venue { border-top: 1px solid var(--line); padding: 10px 14px 12px; }
.vname { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.vname a { font-weight: 600; text-decoration: none; font-size: 15px; }
.vname a:hover { text-decoration: underline; }
.dist { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.frow { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; align-items: baseline; padding: 3px 0; }
.flabel { font-size: 12px; color: var(--muted); line-height: 1.25; }
.flabel em { font-style: normal; opacity: .75; }
.times { display: flex; flex-wrap: wrap; gap: 5px; }
.time { display: inline-block; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--chip-line);
  background: var(--chip); font-size: 13px; font-weight: 600; text-decoration: none; color: var(--accent);
  font-variant-numeric: tabular-nums; }
a.time:hover { border-color: var(--accent); background: var(--accent-soft); }
.time.notix { color: var(--ink); font-weight: 500; cursor: default; }
@media (max-width: 560px) { .frow { grid-template-columns: 1fr; gap: 3px; padding: 4px 0; } }

/* The buttons sit beside the name, or drop under it (lined up with the name) when the card is narrow. */
.thead { padding: 12px 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 12px; align-items: flex-start; cursor: pointer; }
.thead .tname { flex: 1 1 280px; }
@media (max-width: 520px) { .thead .tbtns { margin-left: 26px; } }
.thead:hover h2 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.thead:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 14px; }
.thead h2 { font-size: 17px; margin: 0 0 2px; }
.tname { display: flex; gap: 8px; align-items: flex-start; min-width: 0; }
.tname > svg { flex: none; width: 18px; height: 18px; margin-top: 2px; color: var(--muted); transition: transform .12s ease; }
.folded .tname > svg { transform: rotate(-90deg); }
.tsum { margin-top: 2px; }
.tgroup.inside { border-top: 1px solid var(--line); padding: 8px 14px 6px; }
.mline { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 12px; margin-bottom: 5px; }
.mline .meta { font-size: 12.5px; }
.btn { flex: none; font-size: 13px; padding: 5px 10px; border: 1px solid var(--chip-line); border-radius: 8px; text-decoration: none; background: var(--chip); }
.btn:hover { border-color: var(--accent); }
.tbtns { display: flex; gap: 6px; flex: none; }
/* Top of the theater panel: the All row and the All/Major/Smaller filter side by side. */
.ttop { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.ttop .trow.all { flex: 1 1 260px; min-width: 0; }
.ttop .seg { margin-left: 0; }
.seg.sm button { height: 26px; font-size: 12.5px; padding: 0 10px; white-space: nowrap; }
@media (max-width: 520px) { .ttop .seg { flex: 1 1 100%; } .ttop .seg button { flex: 1; padding: 0 6px; } }
.tcol { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
/* Section labels in the theater list (Major chains / Smaller theaters) and the Theaters view. */
.tgroup { grid-column: 1 / -1; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
  color: var(--muted); padding: 7px 8px 2px; }
.tgroup span, .sech.tsec span { font-weight: 400; }
.sech.tsec { margin: 22px 0 10px; }
.sech.tsec:first-child { margin-top: 0; }
.chk { color: var(--accent); text-decoration: none; }
.chk:hover { text-decoration: underline; }
.tmovie { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 12px; }
.tmovie .art { flex: none; width: 44px; aspect-ratio: 2 / 3; border-radius: 5px; background: var(--line) center/cover no-repeat; cursor: pointer; }
/* Title card in place of a missing poster (art()). */
/* Fixed padding: a percentage would be of the parent's width and squeeze the title to nothing. */
.art.ph { display: flex; flex-direction: column; justify-content: center; padding: 12px; text-align: center;
  overflow: hidden; color: #fff;
  background-image: linear-gradient(160deg, hsl(var(--h) 45% 34%), hsl(calc(var(--h) + 40) 50% 18%)); }
.art.ph span { max-height: 100%; overflow: hidden; font-weight: 700; line-height: 1.15; letter-spacing: -.01em;
  overflow-wrap: anywhere; font-size: 17px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.hero .art.ph { padding: 8px; }
.hero .art.ph span { font-size: 13px; }
.tmovie .art.ph { padding: 3px; }
.tmovie .art.ph span { font-size: 6.5px; }
@media (max-width: 520px) { .tile .art.ph span { font-size: 12px; } }
.tmovie .body { min-width: 0; flex: 1; }

<body>
<header class="top">
  <div class="wrap">
    <div class="titlerow"><h1>Showtimes <button class="cityb" id="cityb" type="button" aria-haspopup="listbox" aria-expanded="false"
        aria-controls="cpop" title="Change city"><span id="city"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"

<div class="wrap">

    <span class="wsum" id="wsum"></span><span class="wupd" id="wupd"></span>

  </button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* Two modes. Local single-city build: DATA is embedded below. Public site: DATA is null,
   and the page loads cities.json plus data/<city>.json beside it. */
let DATA = /*__DATA__*/null;
const EMBEDDED = DATA !== null;

const store = {
  get(k, d) { try { const v = localStorage.getItem('st:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('st:' + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoLocal = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const today = isoLocal(new Date());
const tomorrow = isoLocal(new Date(Date.now() + 864e5));
function miles(a, b) {
  const r = x => x * Math.PI / 180, dLat = r(b.lat - a.lat), dLon = r(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 3958.8 * 2 * Math.asin(Math.sqrt(h));
}

const SORTS = { smart: 'Smart sort', popular: 'Most showtimes', soonest: 'Starting soonest', rt: 'Rotten Tomatoes', lb: 'Letterboxd', az: 'A–Z' };
const AFTER = [[0, 'Any time'], [12, '12 PM'], [15, '3 PM'], [17, '5 PM'], [19, '7 PM'], [21, '9 PM']];
const state = {
  view: store.get('view', 'movies'),
  sort: 'smart',      // every visit opens on Smart sort; a different pick lasts until the page is left
  grp: store.get('grp', false),     // "Group by release type": Just released / Now playing / Re-releases
  after: store.get('after', 0),
  date: null, q: '', movie: null,
  size: store.get('size', 'all'),   // 'all', 'major' or 'minor' theaters (see theaterKind)
  picked: new Set(),  // theater ids to show; empty means all
  fold: new Set(store.get('fold', [])),   // theaters folded to their header in the Theaters view (remembered)
  whereOpen: store.get('where', false),   // phones: map + theater list open (true) or folded into one line
  inView: null,       // theater ids inside the map view; null when every theater is in view
  origin: null        // {lat, lon, label}: the city's center (its nearest theater), for the start view
};
let CITIES = [], theaterById = {}, dates = [], futureDates = [];

/* ---------- formatting ---------- */
function fmtTime(t) {
  const h = Math.floor(t / 100) % 24, m = t % 100;
  return (h % 12 || 12) + ':' + pad(m) + (h < 12 ? 'am' : 'pm');
}
function started(date, t) {
  if (date !== today) return date < today;
  const now = new Date();
  return t < 2400 && Math.floor(t / 100) * 60 + t % 100 < now.getHours() * 60 + now.getMinutes();
}
/* Shown when it hasn't started and passes "starts after". Times past midnight (2400+) count as late. */
function keep(date, t) { return !started(date, t) && (t >= 2400 || t >= state.after * 100); }
function upcoming(g) { return (g.days[state.date] || []).filter(([t]) => keep(state.date, t)).sort((a, b) => a[0] - b[0]); }

const ACCESS = { 'closed captions': 'CC', 'audio description': 'AD', 'on-screen captions': 'Captions' };
function fmtLabel(g) {
  const f = (g.fmt || '').replace(/Standard auditorium\s*/i, '').replace(/with Eng\. subt\./i, 'Subtitled')
    .replace(/Motion Seats/i, '').replace(/\s*•\s*/g, ' · ').replace(/^ · | · $/g, '').trim();
  const extras = g.notes.join(', ').replace(/^Optional:\s*/i, '').split(/,\s*/).filter(Boolean)
    .map(x => ACCESS[x.toLowerCase()] || x);
  return esc(f || 'Standard') + (extras.length ? ` <em>· ${esc(extras.join(' · '))}</em>` : '');
}
function dateLabel(d) {
  const [y, m, day] = d.split('-').map(Number);
  const top = d === today ? 'Today' : d === tomorrow ? 'Tomorrow' : DOW[new Date(y, m - 1, day).getDay()];
  return { top, sub: MON[m - 1] + ' ' + day };
}
/* A film's poster, or for a film with none anywhere (mostly one-off events) a title card: the title
   on a color picked from the title, so the same film always gets the same card. */
function art(m, cls) {
  if (m.poster) return `<div class="art ${cls || ''}" style="background-image:url('${esc(m.poster)}')" role="img" aria-label="${esc(m.title)} poster"></div>`;
  const hue = [...m.title].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
  return `<div class="art ph ${cls || ''}" style="--h:${hue}" role="img" aria-label="${esc(m.title)}"><span>${esc(m.title)}</span></div>`;
}
// Film length in minutes everywhere: cinemaclock writes "2h38m", "2h" or "99m".
function minutes(r) {
  const x = String(r || '').match(/^(?:(\d+)h)?\s*(?:(\d+)m)?$/);
  if (!x || !(x[1] || x[2])) return r || '';
  return `${(+x[1] || 0) * 60 + (+x[2] || 0)} min`;
}
function metaLine(m, full) {
  const bits = [minutes(m.runtime), full ? m.genre : null, m.year].filter(Boolean).map(esc).join(' · ');
  return (m.rating ? `<span class="rating">${esc(m.rating)}</span>` : '') + bits;
}
// Small tomato (60%+) and green splat (below 60%) for the Tomatometer.
const TOMATO = '<svg viewBox="0 0 16 16" aria-label="Fresh"><circle cx="8" cy="9.6" r="5.9" fill="#e4381f"/><ellipse cx="6" cy="7.8" rx="1.6" ry="1" fill="#fff" opacity=".35"/><path d="M8 4.4 6.9 2.6l.2 1.9-2.3-.8 1.5 1.6-2 .7 2.4.3L8 5.6l1.3.7 2.4-.3-2-.7 1.5-1.6-2.3.8.2-1.9z" fill="#3f9a2f"/></svg>';
const SPLAT = '<svg viewBox="0 0 16 16" aria-label="Rotten"><path d="M8 1.6l1.1 2.9 2.8-1.5-.9 3 3.1.6-2.6 1.9 2.1 2.4-3.2-.3.2 3.2L8 11.9l-2.6 1.9.2-3.2-3.2.3 2.1-2.4-2.6-1.9 3.1-.6-.9-3 2.8 1.5z" fill="#5fa82e"/></svg>';
function ratings(m, link) {
  const out = [];
  const wrap = (cls, url, inner) => link && url
    ? `<a class="${cls}" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>` : `<span class="${cls}">${inner}</span>`;
  if (m.rt) {
    const s = m.rt.score;
    out.push(s == null ? wrap('rt none', m.rt.url, 'RT —')
      : wrap('rt ' + (s >= 60 ? 'fresh' : 'rotten'), m.rt.url, (s >= 60 ? TOMATO : SPLAT) + `${s}%`));
  }
  if (m.lb) out.push(m.lb.score == null ? wrap('lb none', m.lb.url, 'LB —')
    : wrap('lb', m.lb.url, `<span class="lbdots"><i></i><i></i><i></i></span>${m.lb.score.toFixed(1)}`));
  return out.length ? `<div class="ratings">${out.join('')}</div>` : '';
}
/* A showing's link is a cinemaclock ticket id, or for a showing that came from Google's listings
   (gfill.py) the Google page for that film there, which carries the ticket options. */
function chips(times) {
  return times.map(([t, tix]) => tix
    ? (/^https:\/\//.test(tix)
      ? `<a class="time" href="${esc(tix)}" target="_blank" rel="noopener" title="Showtime from Google: opens Google for tickets">${fmtTime(t)}</a>`
      : `<a class="time" href="${esc(DATA.tixBase + tix)}" target="_blank" rel="noopener" title="Buy tickets">${fmtTime(t)}</a>`)
    : `<span class="time notix" title="No online ticketing — buy at the theater">${fmtTime(t)}</span>`).join('');
}
function formatRows(groups) {
  return groups.map(g => [g, upcoming(g)]).filter(([, ts]) => ts.length)
    .map(([g, ts]) => `<div class="frow"><div class="flabel">${fmtLabel(g)}</div><div class="times">${chips(ts)}</div></div>`).join('');
}
/* cinemaclock can miss bookings (a chain's new run that hasn't reached it yet), so every theater and
   movie links out to a complete listing: Google's showtimes for a theater, and for a movie its
   Fandango page (every theater showing it, from Rotten Tomatoes) or, failing that, Google. */
const google = q => 'https://www.google.com/search?q=' + encodeURIComponent(q);
const theaterCheck = t => google(`${t.name} ${t.address} showtimes`);
const movieCheck = m => m.rt && m.rt.tix ? m.rt.tix
  : google(`${m.title} showtimes near ${DATA.city}`);

/* A theater is "not listed" on a day when cinemaclock has no times for it at all that day although
   the theater is otherwise covered: it has times on a later day (a feed that skipped today), or none
   all week while the city's theaters are typically listed through that day. That is a gap in the
   source, not "nothing showing", so the page says it can't show times and links out instead of 0. */
let listed = {}, horizon = '';
function indexListings() {
  listed = {};
  DATA.groups.forEach(g => Object.entries(g.days).forEach(([d, ts]) => { if (ts.length) (listed[g.tid] ??= new Set()).add(d); }));
  const lasts = DATA.theaters.map(t => listed[t.id] && [...listed[t.id]].sort().pop()).filter(Boolean).sort();
  horizon = lasts.length ? lasts[Math.floor(lasts.length / 2)] : '';   // the city's median last listed day
  DATA.theaters.forEach(t => { t.kind = theaterKind(t); });
}
/* Major = one of the five national chains, or a large theater. Screen counts aren't published, so
   "large" is judged from showings: a typical day (median over listed days) of LARGE or more, about
   what a national-chain multiplex runs. Everything else is a smaller theater. */
const NATIONAL = /^(amc|regal|edwards|ua |cinemark|century|cinearts|tinseltown|marcus|movie tavern|cin[eé]polis)/i;
const LARGE = 40;
function theaterKind(t) {
  if (NATIONAL.test(t.name)) return 'major';
  const perDay = {};
  DATA.groups.forEach(g => { if (g.tid === t.id) for (const [d, ts] of Object.entries(g.days)) perDay[d] = (perDay[d] || 0) + ts.length; });
  const n = Object.values(perDay).filter(Boolean).sort((a, b) => a - b);
  return n.length && n[Math.floor(n.length / 2)] >= LARGE ? 'major' : 'minor';
}
const KIND = { major: 'Major chains', minor: 'Smaller theaters' };
/* Only a major theater is flagged for a single missing day: chains don't go dark midweek, while a
   smaller theater is often closed on set days, and "couldn't fetch" would be false there. A theater
   with nothing listed all week is flagged whatever its size. */
function unlisted(tid, date) {
  const s = listed[tid];
  if (!s) return date <= horizon;
  if (s.has(date) || theaterById[tid].kind !== 'major') return false;
  return date <= [...s].sort().pop();
}
const dayWord = d => d === today ? 'today' : d === tomorrow ? 'tomorrow' : (l => `${l.top} ${l.sub}`)(dateLabel(d));

/* ---------- selection ---------- */
/* The map view narrows first, then tapped theaters narrow within it. A pick that has left the
   view is set aside (not shown) until the view includes it again or the next tap clears it. */
let livePicks = new Set();
const inView = tid => !state.inView || state.inView.has(tid);
const sizeOk = tid => state.size === 'all' || theaterById[tid].kind === state.size;
const inScope = tid => inView(tid) && sizeOk(tid);          // map view and the All/Major/Smaller filter
function scope() { livePicks = new Set([...state.picked].filter(inScope)); }
const shown = tid => inScope(tid) && (!livePicks.size || livePicks.has(tid));
function visibleGroups() {
  const q = state.q.trim().toLowerCase();
  return DATA.groups.filter(g => g.days[state.date] && shown(g.tid)
    && upcoming(g).length && (!q || DATA.movies[g.mid].title.toLowerCase().includes(q)));
}
const groupBy = (arr, k) => arr.reduce((o, x) => ((o[x[k]] ??= []).push(x), o), {});
const byDist = (a, b) => theaterById[a].dist - theaterById[b].dist;

/* Weeks a film has been out: cinemaclock's "3rd week" label, else from its Rotten Tomatoes release
   date. null when unknown (events, films only Google listed). */
function weeksOut(m) {
  const w = /^(\d+)(?:st|nd|rd|th) week/.exec(m.week || '');
  if (w) return +w[1];
  const r = m.rt && m.rt.released;
  if (!r) return null;
  const days = (new Date(today) - new Date(r)) / 864e5;
  return days >= 0 && days < 365 ? Math.floor(days / 7) + 1 : null;
}
const RELEASE_GROUPS = { just: 'Just released', now: 'Now playing', older: 'Re-releases &amp; special events' };
/* Release group for "Group by release type": out a week or less, other new releases, and the rest. */
function releaseGroup(m) {
  if ((m.kind || 'new') !== 'new') return 'older';
  return weeksOut(m) === 1 ? 'just' : 'now';
}

/* Smart sort: 0.5 quality + 0.3 showings + 0.2 newness, each scored 0 to 1.
   quality  - Letterboxd (out of 5, x20) 70% and Rotten Tomatoes % 30%; one score alone is pulled a
              third of the way toward 60, and no score at all counts as 55, so an unrated film is
              neither buried nor boosted.
   showings - showings left at the theaters shown, log-scaled against the most any film has here
              (300 against 30 is not ten times better).
   newness  - 1 in a film's first week, halving every 3 weeks; unknown 0.5; re-releases and events 0.3. */
const SMART = { quality: 0.5, showings: 0.3, newness: 0.2, lb: 0.7, rt: 0.3 };   // lb + rt = 1, within quality
function smartScores(counts) {
  const M = DATA.movies, top = Math.max(1, ...Object.values(counts));
  const out = {};
  for (const [mid, n] of Object.entries(counts)) {
    const m = M[mid];
    const rt = m.rt && m.rt.score != null ? m.rt.score : null;
    const lb = m.lb && m.lb.score != null ? m.lb.score * 20 : null;
    const one = rt ?? lb;
    const quality = (rt != null && lb != null ? SMART.lb * lb + SMART.rt * rt
      : one != null ? (2 * one + 60) / 3 : 55) / 100;
    const showings = Math.log1p(n) / Math.log1p(top);
    const w = weeksOut(m);
    const newness = (m.kind || 'new') !== 'new' ? 0.3 : w == null ? 0.5 : Math.pow(0.5, (w - 1) / 3);
    out[mid] = SMART.quality * quality + SMART.showings * showings + SMART.newness * newness;
  }
  return out;
}

function sortMovies(byMovie) {
  // Counts are what each tile shows: showings still to come at the theaters shown (picked theaters,
  // the map view and the All/Major/Smaller filter), after "Starts after".
  const left = {};
  for (const [mid, gs] of Object.entries(byMovie)) left[mid] = gs.reduce((k, g) => k + upcoming(g).length, 0);
  const first = {};
  for (const [mid, gs] of Object.entries(byMovie)) first[mid] = Math.min(...gs.flatMap(upcoming).map(([t]) => t));
  const M = DATA.movies, title = (a, b) => M[a].title.localeCompare(M[b].title);
  const score = (m, k) => m[k] && m[k].score != null ? m[k].score : -1;
  const smart = state.sort === 'smart' ? smartScores(left) : {};
  const cmp = {
    smart: (a, b) => smart[b] - smart[a] || title(a, b),
    popular: (a, b) => left[b] - left[a] || title(a, b),
    soonest: (a, b) => first[a] - first[b] || title(a, b),
    rt: (a, b) => score(M[b], 'rt') - score(M[a], 'rt') || title(a, b),
    lb: (a, b) => score(M[b], 'lb') - score(M[a], 'lb') || title(a, b),
    az: title
  }[state.sort] || title;
  return { mids: Object.keys(byMovie).sort(cmp), first };
}

/* ---------- views ---------- */
/* The toolbar's two menus. Each pill shows its label and current choice; tapping opens #menu. */
const MENUS = {
  sort: { label: 'Sort by', opts: () => Object.entries(SORTS), cur: () => state.sort,
    set: v => { state.sort = v; } },
  after: { label: 'Starts after', opts: () => AFTER.map(([v, l]) => [String(v), l]), cur: () => String(state.after),
    set: v => { state.after = Number(v); store.set('after', state.after); } }
};
const CARET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
function toolbar() {
  const pill = key => {
    const M = MENUS[key], cur = M.opts().find(([v]) => v === M.cur());
    return `<button type="button" class="chipb" data-menu="${key}" aria-haspopup="listbox" aria-expanded="${menuFor === key}">` +
      `<span class="cl">${M.label}</span><b>${esc(cur ? cur[1] : '')}</b>${CARET}</button>`;
  };
  // The two menus come first so they share a line on phones; Group by release type and "Updated" share the next.
  // Both views have all three: in Theaters, they order and group the movies inside each theater.
  return pill('sort') + pill('after') +
    `<button type="button" class="chipb tog" id="grp" aria-pressed="${state.grp}">Group by release type</button>`;
}
let menuFor = null;   // which menu is open: 'sort', 'after' or null
function openMenu(btn) {
  const key = btn.dataset.menu, M = MENUS[key], menu = $('menu');
  closeMenu();
  menuFor = key; btn.setAttribute('aria-expanded', 'true');
  menu.setAttribute('aria-label', M.label);
  menu.innerHTML = M.opts().map(([v, l]) =>
    `<button type="button" class="copt" role="option" data-val="${esc(v)}" aria-selected="${v === M.cur()}">${esc(l)}</button>`).join('');
  menu.hidden = false;
  // Just under the pill, kept on screen. The menu sits in the page, so it scrolls with the pill.
  const r = btn.getBoundingClientRect(), host = menu.offsetParent.getBoundingClientRect();
  menu.style.minWidth = Math.max(190, r.width) + 'px';
  const left = Math.min(r.left, document.documentElement.clientWidth - menu.offsetWidth - 8);
  menu.style.left = (Math.max(8, left) - host.left) + 'px';
  menu.style.top = (r.bottom + 6 - host.top) + 'px';
  (menu.querySelector('[aria-selected="true"]') || menu.firstChild).focus();
}
function closeMenu(refocus) {
  if (!menuFor) return;
  const key = menuFor; menuFor = null;
  $('menu').hidden = true;
  const b = document.querySelector(`[data-menu="${key}"]`);
  if (b) { b.setAttribute('aria-expanded', 'false'); if (refocus) b.focus(); }
}
function emptyMsg() {
  const zoomed = state.inView ? ' Zoom out, or tap Reset map, to see more theaters.' : '';
  return `<div class="empty">${state.q ? 'No movies match “' + esc(state.q) + '”.' : 'No upcoming showings for this day with these filters.'}${zoomed}</div>`;
}
let updatedLine = '';   // "Updated Mon 10:35am", set by setData; it ends the toolbar line
function setBar(html) { $('toolbar').innerHTML = `<div class="toolbar">${html}<span class="upd">${updatedLine}</span></div>`; }
function renderGrid() {
  const byMovie = groupBy(visibleGroups(), 'mid');
  const { mids } = sortMovies(byMovie);
  setBar(toolbar());
  const tile = mid => {
    const m = DATA.movies[mid];
    // Screenings still to come that day, at the theaters and times currently shown.
    const n = byMovie[mid].reduce((k, g) => k + upcoming(g).length, 0);
    const label = `<b>${n}</b> screening${n === 1 ? '' : 's'}`;   // still to come, at the theaters shown
    return `<button class="tile" data-mid="${mid}">${art(m)}<h3>${esc(m.title)}</h3>
      <div class="meta">${metaLine(m)}</div>${ratings(m, false)}<div class="next">${label}</div></button>`;
  };
  const section = (title, list) => list.length
    ? `<section class="msec"><h2 class="sech">${title}<span>${list.length}</span></h2><div class="grid">${list.map(tile).join('')}</div></section>` : '';
  if (!mids.length) return emptyMsg();
  // "Group by release type" on: three sections, each in the chosen sort order. Off: one list.
  if (!state.grp) return section('Movies', mids);
  const of = g => mids.filter(mid => releaseGroup(DATA.movies[mid]) === g);
  return Object.entries(RELEASE_GROUPS).map(([g, label]) => section(label, of(g))).join('');
}
function renderDetail(mid) {
  const m = DATA.movies[mid];
  const gs = DATA.groups.filter(g => g.mid === mid && g.days[state.date] && shown(g.tid) && upcoming(g).length);
  const byT = groupBy(gs, 'tid');

/* ---------- map ---------- */
let map = null, markers = {}, resetBtn = null;
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function setupMap() {
  if (!window.L) return;              // offline or CDN blocked: the page works without the map
  $('mapwrap').hidden = false;
  // In the phone layout on a touch screen the map spans the page width, so one-finger drag is left
  // to scrolling the page; two fingers pan and pinch the map. Mouse wheel stays off so scrolling the
  // page never zooms it. setDragging re-checks when the layout changes (rotation, window resize).
  // zoomSnap .25 lets a fitted view sit close to what it was fitted to (whole steps overshoot).
  map = L.map('map', { scrollWheelZoom: false, zoomControl: false, zoomSnap: 0.25 });
  setDragging();
  map.attributionControl.setPrefix(false);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);
  const Reset = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const b = L.DomUtil.create('button', 'mapreset');
      b.type = 'button'; b.textContent = 'Reset map'; b.hidden = true;
      L.DomEvent.disableClickPropagation(b);
      L.DomEvent.on(b, 'click', fitMap);
      return b;
    }

  map.on('moveend', updateView);
  // The map changes size when a phone rotates or the window crosses the phone layout. An
  // untouched map is re-fitted to every theater; a zoomed one keeps its view and re-filters.
  // "Untouched" is read before invalidateSize, which fires moveend (and so updateView) itself.
  // Without ResizeObserver (old browsers) the map simply isn't re-fitted on resize.
  if (window.ResizeObserver) new ResizeObserver(() => {
    const untouched = !state.inView;

}
const PHONE_TOUCH = '(max-width: 520px) and (pointer: coarse)';   // same width as the phone CSS
function setDragging() {

}
/* Zooming or moving the map filters the page to the theaters in view. A theater counts as in view

const DOT = 10;   // largest marker radius in px (styleMarkers)
function inMapView(t) {
  const p = map.latLngToContainerPoint([t.lat, t.lon]), s = map.getSize();
  return p.x >= -DOT && p.y >= -DOT && p.x <= s.x + DOT && p.y <= s.y + DOT;
}
function updateView() {

  const next = ids.length === DATA.theaters.length ? null : new Set(ids);
  const prev = state.inView;
  const same = next === prev || (next && prev && next.size === prev.size && ids.every(id => prev.has(id)));

    markers[t.id] = L.circleMarker([t.lat, t.lon], { radius: 7, weight: 2 })
      .bindTooltip(esc(t.name), { direction: 'top', offset: [0, -6] })

const FIT = { padding: [24, 24], maxZoom: 13 };
const mapPoints = () => DATA.theaters.map(t => [t.lat, t.lon]);
/* Every theater (and a searched place) in view. Reset map uses this. */
function fitMap() {

/* A city opens on half its area: the circle of half the city's radius (10 mi of 20) around its

  const box = L.latLng(state.origin.lat, state.origin.lon).toBounds(half * 2);

function hover(id) {

/* ---------- city loading + location search ---------- */
function setData(d) {
  DATA = d;
  state.origin = { lat: d.lat ?? d.theaters[0].lat, lon: d.lon ?? d.theaters[0].lon, label: d.city };
  DATA.theaters.forEach(t => { t.dist = miles(state.origin, t); });
  DATA.theaters.sort((a, b) => a.dist - b.dist);
  theaterById = Object.fromEntries(DATA.theaters.map(t => [t.id, t]));
  indexListings();
  const all = [...new Set(DATA.groups.flatMap(g => Object.keys(g.days)))].sort();
  futureDates = all.filter(d => d >= today);
  dates = futureDates.length ? futureDates : all;
  if (!dates.includes(state.date)) state.date = dates[0];
  state.picked = new Set();
  state.inView = null;
  if (resetBtn) resetBtn.hidden = true;
  $('city').textContent = DATA.city;
  document.title = 'Showtimes · ' + DATA.city;
  const gen = new Date(DATA.generated);
  updatedLine = `Updated ${DOW[gen.getDay()]} ${fmtTime(gen.getHours() * 100 + gen.getMinutes())}`;
  const notes = [];
  const ageH = (Date.now() - gen.getTime()) / 36e5;
  if (!futureDates.length) notes.push('These times are all in the past. The page needs a rebuild for current showtimes.');
  else if (ageH > 36) notes.push(`These times were collected ${Math.round(ageH / 24)} days ago and may have changed.`);
  if (DATA.failed.length) notes.push('Could not read: ' + DATA.failed.map(esc).join('; '));
  $('notes').innerHTML = notes.map(n => `<div class="note">${n}</div>`).join('');

}

async function loadCity(slug) {

  store.set('city', { slug });

/* ---------- events ---------- */
/* Tapping a theater adds it to or removes it from the picks; "All theaters" (id null) clears them.

// Rows are role="button" divs, so give them the keyboard behaviour a <button> has.
$('theaters').addEventListener('keydown', e => {
  if ((e.key !== 'Enter' && e.key !== ' ') || e.target.closest('a')) return;
  const b = e.target.closest('[data-tid]'); if (!b) return;
  e.preventDefault(); toggleTheater(b.dataset.tid || null);
});
$('theaters').addEventListener('mouseover', e => { const b = e.target.closest('[data-tid]'); hover(b && b.dataset.tid || null); });
$('theaters').addEventListener('mouseleave', () => hover(null));
function setView(v) { state.view = v; store.set('view', v); if (state.movie) location.hash = ''; else render(); }
$('vMovies').onclick = () => setView('movies');
$('vTheaters').onclick = () => setView('theaters');
$('q').addEventListener('input', e => { state.q = e.target.value; if (state.movie) location.hash = ''; else render(); });
$('cityb').addEventListener('click', () => $('cpop').hidden ? openCities() : closeCities());
$('cq').addEventListener('input', () => { cityAct = 0; cityKeyed = !!$('cq').value.trim(); renderCityList(); });
$('cq').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    // The first arrow press shows the highlight where it is (the top); later ones move it.
    if (cityKeyed) cityAct = (cityAct + (e.key === 'ArrowDown' ? 1 : -1) + cityHits.length) % Math.max(cityHits.length, 1);
    cityKeyed = true;
    renderCityList();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (cityKeyed && cityHits[cityAct]) pickCity(cityHits[cityAct].slug);
  }
});
$('clist').addEventListener('click', e => { const b = e.target.closest('[data-slug]'); if (b) pickCity(b.dataset.slug); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCities(true); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#cpop, #cityb')) closeCities(); });
/* Phones: the map + theater list open or fold into the one-line #wherebar (CSS ignores it on computers). */
function applyWhere() {
  $('area').classList.toggle('folded', !state.whereOpen);
  $('wherebar').setAttribute('aria-expanded', state.whereOpen);
}
$('wherebar').addEventListener('click', () => { state.whereOpen = !state.whereOpen; store.set('where', state.whereOpen); applyWhere(); });
/* Phones: scrolling down tucks the whole top bar (city, search, Movies/Theaters and the dates) up
   off the screen so the movies get it all; any scroll up brings it back. Not while the city list
   is open or the movie search box is in use. */
// Slow scrolls wobble (a drifting finger, Android's address bar sliding in and out), so the bar only
// moves after a steady run: TUCK_AFTER px down to hide it, SHOW_AFTER px up to bring it back. anchorY
// is the furthest point reached in the current direction. The stretch past the bottom is ignored.
const PHONE = '(max-width: 520px)', TUCK_AFTER = 30, SHOW_AFTER = 50;
let anchorY = 0, tucked = false;
function setTuck(on) {
  const h = document.querySelector('header.top');
  if (on) h.style.setProperty('--tuck', h.offsetHeight + 'px');
  h.classList.toggle('tuck', on); tucked = on;
}
window.addEventListener('scroll', () => {
  const y = window.scrollY, el = document.documentElement;
  if (!matchMedia(PHONE).matches || !$('cpop').hidden || document.activeElement === $('q') || y < 120) {
    if (tucked) setTuck(false);
    anchorY = y; return;
  }
  if (y + window.innerHeight >= el.scrollHeight - 2) return;   // at (or bouncing off) the bottom
  if (!tucked) {
    if (y < anchorY) anchorY = y;
    else if (y - anchorY > TUCK_AFTER) { setTuck(true); anchorY = y; }
  } else {
    if (y > anchorY) anchorY = y;
    else if (anchorY - y > SHOW_AFTER) { setTuck(false); anchorY = y; }
  }
}, { passive: true });
$('q').addEventListener('focus', () => { if (tucked) setTuck(false); });
// Swiping the sort line sideways would leave an open menu behind; close it.
$('toolbar').addEventListener('scroll', () => closeMenu(), true);
function toggleFold(tid) {
  state.fold.has(tid) ? state.fold.delete(tid) : state.fold.add(tid);
  store.set('fold', [...state.fold]);
  render();
  const h = document.querySelector(`[data-fold="${CSS.escape(tid)}"]`); if (h) h.focus({ preventScroll: true });
}
$('main').addEventListener('keydown', e => {
  if ((e.key !== 'Enter' && e.key !== ' ') || e.target.closest('a')) return;
  const h = e.target.closest('[data-fold]'); if (h) { e.preventDefault(); toggleFold(h.dataset.fold); }
});
$('main').addEventListener('click', e => {
  if (e.target.closest('#back')) return closeMovie();
  const h = e.target.closest('[data-fold]');
  if (h) { if (!e.target.closest('a')) toggleFold(h.dataset.fold); return; }
  const t = e.target.closest('[data-mid]'); if (t) openMovie(t.dataset.mid);
});
$('toolbar').addEventListener('click', e => {
  const m = e.target.closest('[data-menu]');
  if (m) return menuFor === m.dataset.menu ? closeMenu() : openMenu(m);
  if (e.target.closest('#grp')) { state.grp = !state.grp; store.set('grp', state.grp); render(); }
});
$('menu').addEventListener('click', e => {
  const o = e.target.closest('[data-val]'); if (!o) return;
  const key = menuFor;
  MENUS[key].set(o.dataset.val); closeMenu(); render();
  const b = document.querySelector(`[data-menu="${key}"]`); if (b) b.focus();
});
// Up/Down move through the choices, Enter or Space picks (they're buttons), Tab leaves.
$('menu').addEventListener('keydown', e => {
  const os = [...$('menu').querySelectorAll('.copt')], i = os.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    os[(i + (e.key === 'ArrowDown' ? 1 : -1) + os.length) % os.length].focus();
  } else if (e.key === 'Tab') closeMenu();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(true); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('#menu, [data-menu]')) closeMenu(); });
window.addEventListener('resize', () => closeMenu());
$('theaters').addEventListener('click', e => {
  const b = e.target.closest('[data-size]'); if (!b) return;
  state.size = b.dataset.size; store.set('size', state.size);
  render();
});

/* ---------- start ---------- */
(async function start() {
  readHash();
  applyWhere();
  setupMap();
  if (EMBEDDED) {
    $('cityb').disabled = true;   // one city baked in: nothing to choose
    setData(DATA);
    return;
  }
  try {
    CITIES = (await (await fetch('cities.json', { cache: 'no-cache' })).json()).cities;
  } catch (e) {
    $('main').innerHTML = '<div class="empty">Could not load the city list.</div>';
    return;
  }
  const params = new URLSearchParams(location.search);
  const saved = store.get('city', null);
  try {
    // An old ?near=<zip> link, or a saved zip search, falls through to the saved city or the default.
    if (params.get('city') && CITIES.some(c => c.slug === params.get('city'))) await loadCity(params.get('city'));
    else if (saved && CITIES.some(c => c.slug === saved.slug)) await loadCity(saved.slug);
    else await loadCity(CITIES.some(c => c.slug === 'reno-nv') ? 'reno-nv' : CITIES[0].slug);
  } catch (e) {
    $('main').innerHTML = `<div class="empty">Could not load showtimes: ${esc(e.message)}</div>`;
  }
})();
// Drop showings as they start, while the page is open.
// (Not while a menu or the city list is open: re-drawing would pull it out from under the viewer.)
setInterval(() => { if (DATA && !menuFor && $('cpop').hidden) render(); }, 60000);
</script>
</body>
</html>
